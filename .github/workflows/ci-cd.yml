name: CI-CD Pipeline OTel-OCSF-SLM (GCP prototipo-puc)

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

permissions:
  contents: read
  id-token: write

jobs:
  ci-deterministic-and-security-tests:
    name: CI - Validação OCSF v1.9.0, Prompt Injection & Terraform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Executar testes determinísticos, regressão e segurança (OWASP LLM01)
        run: pytest -v

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: Validar IaC Terraform (GCP prototipo-puc)
        working-directory: infra/terraform
        run: |
          terraform init -backend=false
          terraform validate

  cd-deploy-gcp:
    name: CD - Deploy no GCP (prototipo-puc) após aprovação Humana (PR Merge)
    needs: ci-deterministic-and-security-tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Autenticar no GCP via Workload Identity Federation (sem chave JSON)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/811890592302/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-deploy-sa@prototipo-puc.iam.gserviceaccount.com

      - name: Configurar Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: prototipo-puc

      - name: Disparar Cloud Build para atualizar protótipo na VM
        run: gcloud builds submit . --config=cloudbuild.yaml --project=prototipo-puc
