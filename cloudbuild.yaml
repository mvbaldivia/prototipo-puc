substitutions:
  _IMAGE_TAG: "latest"

steps:
  - name: "python:3.12-slim"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        pip install -r requirements.txt
        pytest -v

  - name: "gcr.io/cloud-builders/docker"
    args:
      - "build"
      - "-t"
      - "us-central1-docker.pkg.dev/prototipo-puc/tcc-repo/ai-resilience:${_IMAGE_TAG}"
      - "-f"
      - "ai-resilience/Dockerfile"
      - "."

images:
  - "us-central1-docker.pkg.dev/prototipo-puc/tcc-repo/ai-resilience:${_IMAGE_TAG}"

options:
  logging: CLOUD_LOGGING_ONLY
